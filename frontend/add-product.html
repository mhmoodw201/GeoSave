<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GeoSave — منصة تأجير محلية تعرض لك المنتجات المتاحة للإيجار بالقرب من موقعك.">
    <meta name="theme-color" content="#0f766e">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>أضف إعلاناً — GeoSave</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script type="module" src="/assets/js/pages/add-product.js"></script>
</head>
<body class="page-form">
    <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/" aria-label="GeoSave — الصفحة الرئيسية">
                <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#pin"/></svg></span>
                <span class="brand-name">Geo<span>Save</span></span>
            </a>
            <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="فتح القائمة">
                <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#menu"/></svg>
            </button>
            <nav id="site-nav" class="site-nav" aria-label="التنقل الرئيسي"></nav>
        </div>
    </header>

    <main id="main" class="container section narrow">
        <div id="page-content" hidden>
            <div class="page-head">
                <h1>أضف إعلاناً جديداً</h1>
                <p class="muted">اعرض منتجك للإيجار وسيظهر للمستخدمين القريبين منك.</p>
            </div>
            <form id="add-product-form" class="card form form-card" novalidate>
                <div class="field">
                    <span class="label">صورة المنتج</span>
                    <label id="dropzone" class="dropzone" for="image">
                        <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/heic,image/heif" class="sr-only" required>
                        <span class="dropzone-empty">
                            <span class="dropzone-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#image"/></svg></span>
                            <strong>اضغط لاختيار صورة أو اسحبها هنا</strong>
                            <span class="hint">JPG أو PNG أو WebP — حتى 5 ميجابايت</span>
                        </span>
                        <span id="image-preview" class="dropzone-preview"></span>
                    </label>
                </div>
                <div class="field">
                    <label for="name">اسم المنتج</label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="80" placeholder="مثال: خيمة رحلات لـ 4 أشخاص">
                </div>
                <div class="field">
                    <label for="description">الوصف</label>
                    <textarea id="description" name="description" required minlength="5" maxlength="1000" rows="4" placeholder="اذكر الحالة، المواصفات، وأي شروط للاستخدام…"></textarea>
                    <span id="description-count" class="hint counter">0 / 1000</span>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="price">السعر اليومي (ر.س)</label>
                        <div class="input-wrap">
                            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#cash"/></svg>
                            <input type="number" id="price" name="price" required min="1" max="100000" step="0.5" inputmode="decimal" dir="ltr">
                        </div>
                    </div>
                    <div class="field">
                        <label for="phone">رقم الجوال (واتساب)</label>
                        <div class="input-wrap">
                            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#phone"/></svg>
                            <input type="tel" id="phone" name="phone" required pattern="[+0-9 ]{9,16}" maxlength="16" autocomplete="tel" inputmode="tel" dir="ltr" placeholder="05XXXXXXXX" aria-describedby="phone-hint">
                        </div>
                        <p id="phone-hint" class="hint">يظهر فقط لمن يحجز منتجك.</p>
                    </div>
                </div>
                <div class="field">
                    <span class="label">موقع الإعلان</span>
                    <div id="location-box" class="location-status is-loading" aria-live="polite"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg> نشر الإعلان</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <a class="brand brand-sm" href="/">
                <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#pin"/></svg></span>
                <span class="brand-name">Geo<span>Save</span></span>
            </a>
            <p class="muted">استأجر ما تحتاجه من جيرانك، ووفّر أكثر.</p>
            <p class="muted small">&copy; <span data-year>2026</span> GeoSave. جميع الحقوق محفوظة.</p>
        </div>
    </footer>
</body>
</html>
